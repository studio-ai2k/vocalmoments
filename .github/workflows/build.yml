name: Build static copy of vocalmoments.com

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/build.yml"]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE: https://www.vocalmoments.com
    steps:
      - uses: actions/checkout@v4

      - name: Crawl live site
        run: bash tools/crawl.sh

      - name: Clean up and fetch missing assets
        run: python3 tools/fixup.py

      - name: Publish to gh-pages branch
        run: |
          mkdir -p out/_build
          cp crawl.log seeds.clean.txt out/_build/ 2>/dev/null || true
          cp -r extra/. out/ 2>/dev/null || true
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Static build from ${SITE} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
